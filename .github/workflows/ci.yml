name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (typecheck, testes, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 24: os scripts do gate são TypeScript rodando direto no Node, sem
          # tsx — precisam do type stripping ligado por padrão. É a mesma
          # versão usada na máquina da autoria.
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A régua de contraste (lib/tema/), o julgamento de FEN e lance
      # (lib/chess/) e a ponte usuário↔PIN (lib/auth/). Sem navegador: rodam no
      # test runner do próprio Node.
      - name: Testes
        run: npm test

      # A verdade xadrezística das aulas de finais: cada posição legal, cada
      # lance do método ganhando de fato, cada nó terminal dando mate — julgado
      # contra a tablebase Syzygy.
      #
      # **Roda sem rede, e é isso que o torna um gate.** As respostas da
      # tablebase estão versionadas em `content/tablebase-cache/`; o validador
      # só sai para a internet com `--refresh-cache`, que ninguém passa aqui.
      # Um gate que depende da rede fica vermelho por motivo alheio ao código, e
      # em pouco tempo todo mundo aprende a ignorá-lo.
      #
      # O irmão dele, `npm run validate:mutations` (30 estragos plantados que
      # precisam ficar vermelhos, cada um pelo código de erro certo), roda na
      # máquina da autoria: são 30 execuções do validador, minutos de CI para
      # provar algo que só muda quando o próprio gate muda.
      - name: Conteúdo (tablebase, offline)
        run: npm run validate:content

      - name: Lint
        run: npm run lint

      # O build não recebe chave nenhuma do Supabase, e não precisa: as três
      # rotas que a usam são `ƒ` (renderizadas sob demanda), então nada delas é
      # executado aqui. Se um dia uma virar estática, é aqui que se descobre —
      # em vermelho, e não em produção.
      - name: Build
        run: npm run build
