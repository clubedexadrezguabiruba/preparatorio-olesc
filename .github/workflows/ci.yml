name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (typecheck, testes, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 24: os scripts do gate são TypeScript rodando direto no Node, sem
          # tsx — precisam do type stripping ligado por padrão. É a mesma
          # versão usada na máquina da autoria.
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A régua de contraste (lib/tema/), o julgamento de FEN e lance
      # (lib/chess/) e a ponte usuário↔PIN (lib/auth/). Sem navegador: rodam no
      # test runner do próprio Node.
      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

      # O build não recebe chave nenhuma do Supabase, e não precisa: as três
      # rotas que a usam são `ƒ` (renderizadas sob demanda), então nada delas é
      # executado aqui. Se um dia uma virar estática, é aqui que se descobre —
      # em vermelho, e não em produção.
      - name: Build
        run: npm run build
